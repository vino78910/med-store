<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="16" fill="url(#bannerGrad)" />

  <!-- Subtle Geometric Elements -->
  <circle cx="720" cy="40" r="120" fill="white" opacity="0.05" />
  <circle cx="680" cy="200" r="80" fill="white" opacity="0.05" />
  <path d="M-40,160 Q120,40 280,180 T600,100" fill="none" stroke="white" stroke-width="2" opacity="0.12" />

  <!-- Medical Cross / Shield Icon -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <rect width="140" height="140" rx="28" fill="white" opacity="0.95" />
    <!-- Heartbeat & Cross Combined -->
    <path d="M70,30 L70,110 M30,70 L110,70" stroke="#0284C7" stroke-width="14" stroke-linecap="round" />
    <circle cx="70" cy="70" r="10" fill="#0F766E" />
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="240" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    Vital<tspan fill="#6EE7B7">Med</tspan>
  </text>

  <!-- Tagline -->
  <text x="242" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#E0F2FE" letter-spacing="0.2">
    Right Medicine, Right Time, Every Life.
  </text>

  <!-- Sub-caption badges -->
  <g transform="translate(242, 168)">
    <rect width="130" height="26" rx="6" fill="white" fill-opacity="0.18" />
    <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Stock Monitoring</text>

    <rect x="140" width="120" height="26" rx="6" fill="white" fill-opacity="0.18" />
    <text x="200" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Redistribution</text>

    <rect x="270" width="130" height="26" rx="6" fill="white" fill-opacity="0.18" />
    <text x="335" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Patient Discovery</text>
  </g>
</svg>
