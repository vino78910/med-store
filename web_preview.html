<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalMed - Right Medicine, Right Time, Every Life</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .phone-container {
      width: 390px;
      height: 844px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3), 0 0 0 12px #1e293b;
      border-radius: 46px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
      position: relative;
    }
    .notch {
      width: 140px;
      height: 24px;
      background: #1e293b;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 50;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .badge-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- Top Controller Bar for Hackathon Judges -->
  <div class="max-w-4xl w-full mb-4 bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center text-white text-xl shadow-lg shadow-teal-500/20">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white flex items-center gap-2">
          VitalMed <span class="text-xs bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-full border border-teal-500/30">Mobile App Demo</span>
        </h1>
        <p class="text-xs text-slate-400">"Right Medicine, Right Time, Every Life."</p>
      </div>
    </div>

    <!-- 1-Click Role Switcher -->
    <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
      <span class="text-xs text-slate-400 pl-2 pr-1 font-medium">Switch Role:</span>
      <button onclick="switchRole('admin')" id="role-admin-btn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-teal-600 text-white shadow-sm transition">
        Pharmacy A (Admin)
      </button>
      <button onclick="switchRole('pharmacist')" id="role-pharm-btn" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition">
        Pharmacy B (Surplus)
      </button>
      <button onclick="switchRole('patient')" id="role-patient-btn" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition">
        Patient Mode
      </button>
    </div>

    <!-- Quick Action Triggers -->
    <div class="flex items-center gap-2">
      <button onclick="triggerDispenseShortage()" class="text-xs bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:bg-amber-500/20 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
        <i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Dispense (Trigger Shortage)
      </button>
      <button onclick="resetAllData()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 font-medium transition">
        <i class="fa-solid fa-rotate-right mr-1"></i> Reset
      </button>
    </div>
  </div>

  <!-- Mobile Device Shell -->
  <div class="phone-container">
    <div class="notch"></div>

    <!-- iOS / Android Status Bar -->
    <div class="h-10 pt-2 px-7 flex items-center justify-between text-xs font-semibold text-slate-800 z-40 bg-white">
      <span>9:41</span>
      <div class="flex items-center gap-1.5 text-[11px]">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full text-xs"></i>
      </div>
    </div>

    <!-- App Header -->
    <div class="bg-white px-5 py-3 border-b border-slate-200 flex items-center justify-between text-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-teal-600 flex items-center justify-center text-white text-sm shadow-md shadow-teal-600/30">
          <i class="fa-solid fa-hand-holding-medical"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-sm tracking-tight text-slate-900">VitalMed</span>
            <span id="role-badge" class="text-[10px] bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full font-bold">Pharmacy Admin</span>
          </div>
          <p id="sub-header" class="text-[11px] text-slate-500 truncate max-w-[190px]">Apex Care Pharmacy (Central)</p>
        </div>
      </div>

      <!-- Notification Bell with reactive badge -->
      <button onclick="openNotificationModal()" class="relative p-2 text-slate-600 hover:text-slate-900 transition">
        <i class="fa-regular fa-bell text-lg"></i>
        <span id="notif-badge" class="absolute top-1 right-1 w-4 h-4 bg-rose-500 text-white text-[9px] font-black rounded-full flex items-center justify-center badge-pulse">2</span>
      </button>
    </div>

    <!-- Scrollable Screen Content -->
    <div id="screen-content" class="flex-1 overflow-y-auto custom-scroll p-4 text-slate-800">
      <!-- Screen content is rendered by JS -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div id="bottom-nav" class="bg-white border-t border-slate-200 px-4 py-2 flex items-center justify-around text-slate-400">
      <!-- Nav tabs rendered dynamically based on active role -->
    </div>
  </div>

  <!-- In-App Notification Center Modal -->
  <div id="notif-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white text-slate-800 max-w-sm w-full rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[500px]">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-bell text-teal-600"></i>
          <span class="font-bold text-sm">Notification Centre</span>
        </div>
        <button onclick="closeNotificationModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="notif-list" class="p-3 overflow-y-auto custom-scroll space-y-2 flex-1">
        <!-- Notifications rendered here -->
      </div>
      <div class="p-3 border-t border-slate-100 bg-slate-50 text-right">
        <button onclick="markAllNotifsRead()" class="text-xs text-teal-600 font-bold hover:underline">Mark all as read</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // STATE MACHINE (MOCK DATA & REACTIVE LOGIC)
    // =========================================================================
    let currentRole = 'admin'; // 'admin', 'pharmacist', 'patient'
    let currentTab = 0; // 0: Dashboard/Home, 1: Inventory/Find, 2: Predictions/Alerts, 3: Requests, 4: Transfers

    const state = {
      pharmacies: {
        pharmacy_a: { id: 'pharmacy_a', name: 'Apex Care Pharmacy', address: '12 Health Blvd, Sector 14', distanceKm: 0.0, phone: '+91 98765 43210' },
        pharmacy_b: { id: 'pharmacy_b', name: 'Metro Cure Pharmacy', address: '88 Central Ave, Market Complex', distanceKm: 1.5, phone: '+91 98111 22334' },
        pharmacy_c: { id: 'pharmacy_c', name: 'GreenCross Chemist', address: '45 Riverside Colony', distanceKm: 2.8, phone: '+91 98222 33445' }
      },
      inventory: [
        {
          id: 'inv_a_para', pharmacyId: 'pharmacy_a', medicineName: 'Paracetamol Syrup', genericName: 'Acetaminophen Oral Susp.',
          strength: '250mg/5ml', form: 'Syrup', currentStock: 10, minReserve: 25, avgDailyBurn: 5.0,
          status: 'WARNING', daysRemaining: 2.0, trend: 'INCREASING', unit: 'bottles'
        },
        {
          id: 'inv_a_amox', pharmacyId: 'pharmacy_a', medicineName: 'Amoxicillin Oral Susp.', genericName: 'Amoxicillin Trihydrate',
          strength: '125mg/5ml', form: 'Suspension', currentStock: 45, minReserve: 20, avgDailyBurn: 2.5,
          status: 'NORMAL', daysRemaining: 18.0, trend: 'STABLE', unit: 'bottles'
        },
        {
          id: 'inv_a_salb', pharmacyId: 'pharmacy_a', medicineName: 'Salbutamol Inhaler', genericName: 'Albuterol Inhaler',
          strength: '100mcg', form: 'Inhaler', currentStock: 2, minReserve: 10, avgDailyBurn: 2.0,
          status: 'CRITICAL', daysRemaining: 1.0, trend: 'STABLE', unit: 'inhalers'
        },
        {
          id: 'inv_b_para', pharmacyId: 'pharmacy_b', medicineName: 'Paracetamol Syrup', genericName: 'Acetaminophen Oral Susp.',
          strength: '250mg/5ml', form: 'Syrup', currentStock: 120, minReserve: 20, avgDailyBurn: 4.0,
          status: 'NORMAL', daysRemaining: 30.0, trend: 'STABLE', unit: 'bottles'
        },
        {
          id: 'inv_c_para', pharmacyId: 'pharmacy_c', medicineName: 'Paracetamol Syrup', genericName: 'Acetaminophen Oral Susp.',
          strength: '250mg/5ml', form: 'Syrup', currentStock: 15, minReserve: 20, avgDailyBurn: 3.0,
          status: 'NORMAL', daysRemaining: 5.0, trend: 'STABLE', unit: 'bottles'
        }
      ],
      requests: [
        {
          id: 'req_001', fromId: 'pharmacy_a', fromName: 'Apex Care Pharmacy', toId: 'pharmacy_b', toName: 'Metro Cure Pharmacy',
          medicineName: 'Paracetamol Syrup', strength: '250mg/5ml', quantity: 20, status: 'PENDING', distanceKm: 1.5,
          time: '15 mins ago'
        }
      ],
      transfers: [],
      patientSubscriptions: [
        { id: 'sub_01', medicineName: 'Paracetamol Syrup', strength: '250mg/5ml', radiusKm: 10, active: true }
      ],
      savedSearches: [
        { query: 'Paracetamol Syrup', radius: 5, date: 'Today' },
        { query: 'Amoxicillin Oral Susp.', radius: 10, date: 'Yesterday' }
      ],
      notifications: [
        {
          id: 'n1', category: 'WARNING', title: '⚠️ Early Stock Warning: Paracetamol Syrup',
          body: 'Paracetamol Syrup may run out in 2.0 days. Current stock: 10 bottles.',
          target: 'pharmacy_a', read: false, time: '20 mins ago'
        },
        {
          id: 'n2', category: 'INCOMING', title: '📦 Incoming Redistribution Request',
          body: 'Apex Care Pharmacy needs 20 bottles of Paracetamol Syrup. Your surplus: 92 bottles.',
          target: 'pharmacy_b', read: false, time: '15 mins ago'
        }
      ]
    };

    // =========================================================================
    // LOGIC & FORMULA COMPUTATIONS
    // =========================================================================
    function recalculateStockMetrics(item) {
      if (item.currentStock <= 0) {
        item.currentStock = 0;
        item.daysRemaining = 0.0;
        item.status = 'OUT OF STOCK';
      } else if (item.avgDailyBurn > 0) {
        item.daysRemaining = parseFloat((item.currentStock / item.avgDailyBurn).toFixed(1));
        if (item.daysRemaining <= 1.0) {
          item.status = 'CRITICAL';
        } else if (item.daysRemaining <= 3.0) {
          item.status = 'WARNING';
        } else {
          item.status = 'NORMAL';
        }
      } else {
        item.daysRemaining = 999.0;
        item.status = 'NORMAL';
      }
    }

    function switchRole(role) {
      currentRole = role;
      currentTab = 0;

      // Update button highlights
      document.getElementById('role-admin-btn').className = role === 'admin'
        ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-teal-600 text-white shadow-sm transition'
        : 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition';

      document.getElementById('role-pharm-btn').className = role === 'pharmacist'
        ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white shadow-sm transition'
        : 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition';

      document.getElementById('role-patient-btn').className = role === 'patient'
        ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-purple-600 text-white shadow-sm transition'
        : 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition';

      const badge = document.getElementById('role-badge');
      const sub = document.getElementById('sub-header');

      if (role === 'admin') {
        badge.textContent = 'Pharmacy Admin';
        badge.className = 'text-[10px] bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full font-bold';
        sub.textContent = 'Apex Care Pharmacy (Central)';
      } else if (role === 'pharmacist') {
        badge.textContent = 'Metro Cure (Surplus)';
        badge.className = 'text-[10px] bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full font-bold';
        sub.textContent = 'Metro Cure Pharmacy (North)';
      } else {
        badge.textContent = 'Patient View';
        badge.className = 'text-[10px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full font-bold';
        sub.textContent = 'Jane Doe (Metro Green Enclave)';
      }

      renderApp();
    }

    function renderApp() {
      renderNav();
      renderScreen();
      updateNotifBadge();
    }

    function renderNav() {
      const nav = document.getElementById('bottom-nav');
      if (currentRole === 'patient') {
        nav.innerHTML = `
          <button onclick="setTab(0)" class="flex flex-col items-center gap-1 ${currentTab===0?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-house text-base"></i><span class="text-[10px]">Home</span>
          </button>
          <button onclick="setTab(1)" class="flex flex-col items-center gap-1 ${currentTab===1?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-magnifying-glass text-base"></i><span class="text-[10px]">Find Med</span>
          </button>
          <button onclick="setTab(2)" class="flex flex-col items-center gap-1 ${currentTab===2?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-bell text-base"></i><span class="text-[10px]">Alerts</span>
          </button>
          <button onclick="setTab(3)" class="flex flex-col items-center gap-1 ${currentTab===3?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-bookmark text-base"></i><span class="text-[10px]">Saved</span>
          </button>
          <button onclick="setTab(4)" class="flex flex-col items-center gap-1 ${currentTab===4?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-user text-base"></i><span class="text-[10px]">Profile</span>
          </button>
        `;
      } else {
        const pendingCount = state.requests.filter(r => r.status === 'PENDING' && r.toId === (currentRole === 'admin' ? 'pharmacy_a' : 'pharmacy_b')).length;
        nav.innerHTML = `
          <button onclick="setTab(0)" class="flex flex-col items-center gap-1 ${currentTab===0?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-chart-pie text-base"></i><span class="text-[10px]">Dashboard</span>
          </button>
          <button onclick="setTab(1)" class="flex flex-col items-center gap-1 ${currentTab===1?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-boxes-stacked text-base"></i><span class="text-[10px]">Inventory</span>
          </button>
          <button onclick="setTab(2)" class="flex flex-col items-center gap-1 ${currentTab===2?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-chart-line text-base"></i><span class="text-[10px]">Predictions</span>
          </button>
          <button onclick="setTab(3)" class="relative flex flex-col items-center gap-1 ${currentTab===3?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-inbox text-base"></i><span class="text-[10px]">Requests</span>
            ${pendingCount > 0 ? `<span class="absolute -top-1 right-2 w-3.5 h-3.5 bg-sky-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center">${pendingCount}</span>` : ''}
          </button>
          <button onclick="setTab(4)" class="flex flex-col items-center gap-1 ${currentTab===4?'text-teal-600 font-bold':'text-slate-400'}">
            <i class="fa-solid fa-arrow-right-arrow-left text-base"></i><span class="text-[10px]">Transfers</span>
          </button>
        `;
      }
    }

    function setTab(tab) {
      currentTab = tab;
      renderApp();
    }

    function renderScreen() {
      const container = document.getElementById('screen-content');
      if (currentRole === 'patient') {
        if (currentTab === 0) container.innerHTML = getPatientHomeScreen();
        else if (currentTab === 1) container.innerHTML = getPatientFindMedScreen();
        else if (currentTab === 2) container.innerHTML = getPatientAlertsScreen();
        else if (currentTab === 3) container.innerHTML = getPatientSavedSearchesScreen();
        else container.innerHTML = getPatientProfileScreen();
      } else {
        const phId = currentRole === 'admin' ? 'pharmacy_a' : 'pharmacy_b';
        if (currentTab === 0) container.innerHTML = getPharmacyDashboardScreen(phId);
        else if (currentTab === 1) container.innerHTML = getPharmacyInventoryScreen(phId);
        else if (currentTab === 2) container.innerHTML = getPharmacyPredictionsScreen(phId);
        else if (currentTab === 3) container.innerHTML = getPharmacyRequestsScreen(phId);
        else container.innerHTML = getPharmacyTransfersScreen(phId);
      }
    }

    // =========================================================================
    // PHARMACY SCREENS
    // =========================================================================
    function getPharmacyDashboardScreen(phId) {
      const items = state.inventory.filter(i => i.pharmacyId === phId);
      const normalCount = items.filter(i => i.status === 'NORMAL').length;
      const warningCount = items.filter(i => i.status === 'WARNING').length;
      const criticalCount = items.filter(i => i.status === 'CRITICAL').length;
      const outCount = items.filter(i => i.status === 'OUT OF STOCK').length;

      return `
        <div class="space-y-4">
          <!-- Metric Cards -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <span class="text-[11px] font-semibold text-slate-500">Total Medicines</span>
              <div class="text-xl font-extrabold text-slate-800 mt-0.5">${items.length}</div>
              <span class="text-[10px] text-teal-600 font-medium">Active In Stock</span>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
              <span class="text-[11px] font-semibold text-emerald-600">NORMAL</span>
              <div class="text-xl font-extrabold text-emerald-600 mt-0.5">${normalCount}</div>
              <span class="text-[10px] text-slate-400">Stock healthy (> 3d)</span>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-amber-200 shadow-sm bg-amber-50/30">
              <span class="text-[11px] font-semibold text-amber-600">WARNING</span>
              <div class="text-xl font-extrabold text-amber-600 mt-0.5">${warningCount}</div>
              <span class="text-[10px] text-amber-500">Runout in <= 3d</span>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-rose-200 shadow-sm bg-rose-50/30">
              <span class="text-[11px] font-semibold text-rose-600">CRITICAL</span>
              <div class="text-xl font-extrabold text-rose-600 mt-0.5">${criticalCount}</div>
              <span class="text-[10px] text-rose-500">Runout in <= 1d</span>
            </div>
          </div>

          <!-- Active Stock Warning / Alerts -->
          ${warningCount > 0 || criticalCount > 0 ? `
            <div class="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 shadow-sm">
              <div class="flex items-center gap-2 text-amber-800 font-bold text-xs">
                <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> Stockout Risk Detected
              </div>
              <p class="text-xs text-amber-900 mt-1">
                <strong>Paracetamol Syrup:</strong> 10 bottles remaining (~2.0 days burn).
              </p>
              <div class="mt-2.5 flex gap-2">
                <button onclick="findNearbyForRedistribution('Paracetamol Syrup')" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 shadow-sm">
                  <i class="fa-solid fa-share-nodes"></i> Connect Nearby Pharmacies
                </button>
              </div>
            </div>
          ` : `
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-xs text-emerald-800 flex items-center gap-2">
              <i class="fa-solid fa-circle-check text-emerald-600"></i> All inventory stock levels are healthy.
            </div>
          `}

          <!-- Quick Action Buttons -->
          <div class="flex gap-2">
            <button onclick="setTab(1)" class="flex-1 bg-white border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-slate-700 flex items-center justify-center gap-1.5 hover:bg-slate-50">
              <i class="fa-solid fa-plus text-teal-600"></i> Restock Med
            </button>
            <button onclick="findNearbyForRedistribution('Paracetamol Syrup')" class="flex-1 bg-teal-50 border border-teal-200 p-2.5 rounded-xl text-xs font-bold text-teal-700 flex items-center justify-center gap-1.5 hover:bg-teal-100">
              <i class="fa-solid fa-satellite-dish"></i> Search Surplus
            </button>
          </div>
        </div>
      `;
    }

    function getPharmacyInventoryScreen(phId) {
      const items = state.inventory.filter(i => i.pharmacyId === phId);
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700">Inventory Catalog (${items.length})</span>
            <span class="text-[10px] text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full font-bold">Real-time Listeners Active</span>
          </div>

          ${items.map(item => `
            <div class="bg-white p-3.5 rounded-2xl border ${item.status==='CRITICAL'?'border-rose-300':(item.status==='WARNING'?'border-amber-300':'border-slate-200')} shadow-sm space-y-2">
              <div class="flex items-start justify-between">
                <div>
                  <h4 class="font-bold text-sm text-slate-900">${item.medicineName}</h4>
                  <p class="text-[11px] text-slate-500">${item.strength} • ${item.form}</p>
                </div>
                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                  item.status === 'CRITICAL' ? 'bg-rose-100 text-rose-700' :
                  (item.status === 'WARNING' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')
                }">${item.status}</span>
              </div>

              <div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded-xl text-[11px]">
                <div><span class="text-slate-400 block text-[9px]">STOCK</span><strong>${item.currentStock}</strong> ${item.unit}</div>
                <div><span class="text-slate-400 block text-[9px]">DAYS LEFT</span><strong class="${item.daysRemaining<=3?'text-amber-600 font-black':'text-slate-700'}">${item.daysRemaining} d</strong></div>

    function acceptRequest(reqId) {
      const req = state.requests.find(r => r.id === reqId);
      if (req) {
        req.status = 'ACCEPTED';
        state.transfers.push({
          id: 'TR-' + Math.floor(100000 + Math.random() * 900000),
          medicineName: req.medicineName,
          quantity: req.quantity,
          sourceId: req.toId,
          sourceName: req.toName,
          destId: req.fromId,
          destName: req.fromName,
          batch: 'BATCH-2024-PARA9',
          status: 'ACCEPTED'
        });
        alert("✅ Request Accepted!\n\nTransfer record generated and ready for regulatory compliance verification.");
        setTab(4);
      }
    }

    function approveTransferCompliance(trId) {
      const tr = state.transfers.find(t => t.id === trId);
      if (tr) {
        tr.status = 'APPROVED';
        alert("🛡️ Regulatory Compliance Verified!\n\nBatch integrity, cold chain & drug license verified. Cleared for dispatch.");
        renderApp();
      }
    }

    function dispatchTransfer(trId) {
      const tr = state.transfers.find(t => t.id === trId);
      if (tr) {
        tr.status = 'IN TRANSIT';
        alert("🚚 Courier Dispatched!\n\nPackage marked IN TRANSIT under temperature-controlled medical courier.");
        renderApp();
      }
    }

    function completeTransferAtomic(trId) {
      const tr = state.transfers.find(t => t.id === trId);
      if (tr) {
        // Atomic Dual-Inventory Execution!
        const sourceItem = state.inventory.find(i => i.pharmacyId === tr.sourceId && i.medicineName === tr.medicineName);
        const destItem = state.inventory.find(i => i.pharmacyId === tr.destId && i.medicineName === tr.medicineName);

        if (sourceItem && destItem) {
          sourceItem.currentStock -= tr.quantity;
          recalculateStockMetrics(sourceItem);

          destItem.currentStock += tr.quantity;
          recalculateStockMetrics(destItem); // Restores to healthy status!
        }

        tr.status = 'COMPLETED';

        alert("🎉 ATOMIC DUAL-INVENTORY SYNC COMPLETED!\n\n" +
              "• " + tr.sourceName + " stock reduced by " + tr.quantity + " bottles (New: " + sourceItem.currentStock + ")\n" +
              "• " + tr.destName + " stock increased by " + tr.quantity + " bottles (New: " + destItem.currentStock + ")\n" +
              "• Stockout alert resolved automatically! Days remaining restored to " + destItem.daysRemaining + " days.\n" +
              "• Patients searching for Paracetamol Syrup can now see availability.");

        renderApp();
      }
    }

    function triggerDispenseShortage() {
      const item = state.inventory.find(i => i.id === 'inv_a_para');
      if (item && item.currentStock >= 5) {
        item.currentStock -= 5;
        recalculateStockMetrics(item);
        alert("Simulated customer sale: Dispensed 5 bottles of Paracetamol Syrup.\n\nCurrent Stock: " + item.currentStock + " bottles.\nEstimated Days Remaining: " + item.daysRemaining + " days -> " + item.status + "!");
        renderApp();
      }
    }

    function promptRestock(itemId) {
      const item = state.inventory.find(i => i.id === itemId);
      const qty = prompt("Enter quantity to restock for " + item.medicineName + ":", "50");
      if (qty && parseInt(qty) > 0) {
        item.currentStock += parseInt(qty);
        recalculateStockMetrics(item);
        alert("Restocked " + qty + " " + item.unit + " of " + item.medicineName + ".");
        renderApp();
      }
    }

    function promptDispense(itemId) {
      const item = state.inventory.find(i => i.id === itemId);
      const qty = prompt("Enter quantity to dispense for " + item.medicineName + ":", "2");
      if (qty && parseInt(qty) > 0) {
        if (parseInt(qty) > item.currentStock) {
          alert("❌ Validation Error: Cannot dispense " + qty + ". Current stock is only " + item.currentStock + " (prevents negative stock).");
          return;
        }
        item.currentStock -= parseInt(qty);
        recalculateStockMetrics(item);
        renderApp();
      }
    }

    function subscribePatientAlert(medName) {
      state.patientSubscriptions.push({
        id: 'sub_' + Date.now(),
        medicineName: medName,
        strength: 'Standard',
        radiusKm: 10,
        active: true
      });
      alert("✅ Subscribed to restock alerts for " + medName + "!\nYou will be notified as soon as a pharmacy restocks it.");
      renderApp();
    }

    function addSavedSearch() {
      const q = prompt('Enter medicine name to save for quick lookup:', 'Salbutamol Inhaler');
      if (q && q.trim()) {
        state.savedSearches.push({ query: q.trim(), radius: 5, date: 'Just now' });
        renderApp();
      }
    }

    function removeSavedSearch(idx) {
      state.savedSearches.splice(idx, 1);
      renderApp();
    }

    function resetAllData() {
      state.inventory.find(i => i.id === 'inv_a_para').currentStock = 10;
      state.inventory.find(i => i.id === 'inv_b_para').currentStock = 120;
      state.inventory.forEach(i => recalculateStockMetrics(i));
      state.transfers = [];
      alert("Demo data reset to initial baseline!");
      renderApp();
    }

    function openNotificationModal() {
      const modal = document.getElementById('notif-modal');
      const list = document.getElementById('notif-list');
      const phId = currentRole === 'admin' ? 'pharmacy_a' : 'pharmacy_b';

      const notifs = state.notifications.filter(n => currentRole === 'patient' ? true : n.target === phId);
      list.innerHTML = notifs.map(n => `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-1">
          <div class="flex justify-between items-center">
            <strong class="text-slate-800">${n.title}</strong>
            <span class="text-[9px] text-slate-400">${n.time}</span>
          </div>
          <p class="text-slate-600 text-[11px]">${n.body}</p>
        </div>
      `).join('');

      modal.classList.remove('hidden');
    }

    function closeNotificationModal() {
      document.getElementById('notif-modal').classList.add('hidden');
    }

    function markAllNotifsRead() {
      state.notifications.forEach(n => n.read = true);
      updateNotifBadge();
      closeNotificationModal();
    }

    function updateNotifBadge() {
      const phId = currentRole === 'admin' ? 'pharmacy_a' : 'pharmacy_b';
      const unread = state.notifications.filter(n => !n.read && (currentRole === 'patient' || n.target === phId)).length;
      const badge = document.getElementById('notif-badge');
      if (unread > 0) {
        badge.textContent = unread;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Initialize initial render
    renderApp();
  </script>
</body>
</html>
